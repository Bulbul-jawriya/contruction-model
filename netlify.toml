# Netlify: build the React app in ./frontend and publish its dist folder.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"          # relative to base

[build.environment]
  NODE_VERSION = "22"       # Vite 8 needs Node 20.19+ / 22.12+
  # Backend URL baked into the bundle at BUILD time (plain URL, no trailing slash, no Markdown). Not a secret.
  VITE_API_URL = "https://construction-intelligence-2.onrender.com"
